name: Eval

# Chạy tay (tab Actions → Eval → Run workflow). Không cần secret: chỉ chạy phần KHÔNG dùng LLM
# (pytest + độ phủ, golden reference, mutation test) và ghi eval/results/report.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      LLM_PROVIDER: mock
      LLM_FALLBACK: none
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run eval (mock, không tốn token)
        run: python eval/run_eval.py
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
