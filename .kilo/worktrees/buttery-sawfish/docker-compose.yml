services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Theo .env; không có thì mock. Ép mô phỏng: LLM_PROVIDER=mock docker compose up
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      # Volume của Docker (không gắn thư mục Windows): checkpoint SQLite chế độ WAL cần ổ Linux để ghi an toàn.
      # Lần đầu chạy, API tự sinh dữ liệu mẫu vào data/sources.
      - backend-data:/app/data
      - backend-workspaces:/app/pipelines/workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Trình duyệt gọi thẳng API nên đây là địa chỉ nhìn từ máy người dùng
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-workspaces:
