# Alembic: schema changes for the application database (PostgreSQL). Migrations live in Git: migrations/versions/.
# No connection string here: it comes from MIGRATION_DATABASE_URL (migration account) in the environment / .env.
#   alembic upgrade head
# Never run against production without the user's approval (CLAUDE.md section 10).
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (cp1252 on Windows).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
