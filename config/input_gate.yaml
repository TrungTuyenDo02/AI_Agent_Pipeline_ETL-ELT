# Cấu hình cửa kiểm tra đầu vào (tầng 0 và tầng 1). Mọi mẫu viết KHÔNG DẤU, chữ thường: yêu cầu được
# chuẩn hóa (bỏ dấu tiếng Việt, đ -> d, ký tự lạ thành khoảng trắng) trước khi so khớp.
# Sửa file này là đủ để cập nhật; không cần sửa code. Đây chỉ là lớp chặn cơ bản, không thay V1/V2.

# ---- Tầng 0: mẫu tấn công prompt đơn giản (regex trên chuỗi đã chuẩn hóa) ----
attack_patterns:
  - 'bo qua (tat ca |moi )?(huong dan|chi dan|quy tac|lenh) (truoc|o tren|ban dau)'
  - 'quen (het |di )?(huong dan|chi dan|quy tac) (truoc|ban dau)'
  - 'ignore (all |any )?(the )?(previous|prior|above|earlier) (instructions?|prompts?|rules?)'
  - 'disregard (all |any )?(the )?(previous|prior|above) (instructions?|prompts?)'
  - 'system prompt'
  - 'prompt he thong'
  - 'developer message'
  - 'jailbreak'
  - 'do anything now'
  - 'ban dang o che do (nha phat trien|developer|admin)'
  - 'you are now (in )?(developer|dan|admin|root)'
  - '(in ra|hien thi|cho toi xem|cho xem|tiet lo|lo ra|doc ra|liet ke|show|print|reveal|display|dump|leak|echo|cat) .{0,40}(api key|apikey|khoa api|secret|mat khau|password|token|bien moi truong|environment variable|env var|\.env|connection string|chuoi ket noi)'
  - '(api key|apikey|khoa api|mat khau|password|bien moi truong|connection string|chuoi ket noi) .{0,20}(la gi|la bao nhieu|cua ban|cua he thong|cua ung dung)'

