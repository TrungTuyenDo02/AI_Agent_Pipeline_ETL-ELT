services:
  # PostgreSQL cục bộ cho đăng nhập/nhật ký (dev giống thật; KHÔNG dùng SQLite làm mặc định).
  # Lần đầu: điền POSTGRES_PASSWORD, P113_MIGRATOR_PASSWORD, P113_APP_PASSWORD trong .env rồi `docker compose up -d db`.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      P113_MIGRATOR_PASSWORD: ${P113_MIGRATOR_PASSWORD:-}
      P113_APP_PASSWORD: ${P113_APP_PASSWORD:-}
    ports:
      # Chỉ máy này, không mở ra mạng. Cổng 5433 để không đụng PostgreSQL cài sẵn trên máy (thường chiếm 5432)
      - "127.0.0.1:${P113_DB_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-p113.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nguồn PostgreSQL thử cho PostgresConnector (profile `dev-sources`, KHÔNG bật mặc định):
  #   docker compose --profile dev-sources up -d sources-db
  #   python scripts/seed_pg_sources.py --dsn postgresql://postgres:<mật khẩu>@127.0.0.1:5434/p113_retail --reader p113_reader --reader-password <...>
  # Mật khẩu quản trị lấy từ P113_SOURCES_ADMIN_PASSWORD trong .env (để trống thì container không khởi động).
  sources-db:
    profiles: ["dev-sources"]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${P113_SOURCES_ADMIN_PASSWORD:-}
      POSTGRES_DB: p113_retail
    ports:
      - "127.0.0.1:${P113_SOURCES_PORT:-5434}:5432"
    volumes:
      - sources-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p113_retail"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chạy migration bằng tài khoản migration (không nằm trong container backend):
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://p113_migrator:${P113_MIGRATOR_PASSWORD:-}@db:5432/p113_dev
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Theo .env; không có thì mock. Ép mô phỏng: LLM_PROVIDER=mock docker compose up
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # Tài khoản ỨNG DỤNG (không phải superuser, không phải migration); mật khẩu lấy từ .env
      DATABASE_URL: postgresql+psycopg://p113_app:${P113_APP_PASSWORD:-}@db:5432/p113_dev
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volume của Docker (không gắn thư mục Windows): checkpoint SQLite chế độ WAL cần ổ Linux để ghi an toàn.
      # Lần đầu chạy, API tự sinh dữ liệu mẫu vào data/sources.
      - backend-data:/app/data
      - backend-workspaces:/app/pipelines/workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Trình duyệt gọi thẳng API nên đây là địa chỉ nhìn từ máy người dùng
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  sources-pg-data:
  backend-data:
  backend-workspaces:
