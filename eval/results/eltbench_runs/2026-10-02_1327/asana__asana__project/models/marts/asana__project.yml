version: 2
models:
- name: asana__project
  columns:
  - name: project_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project')
          field: id
  - name: project_name
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: name
  - name: number_of_open_tasks
    data_tests:
    - relationships:
        arguments:
          to: ref('project_task')
          field: task_id, task.completed
  - name: number_of_assigned_open_tasks
    data_tests:
    - relationships:
        arguments:
          to: ref('project_task')
          field: task_id, task.completed, task.assignee_id
  - name: number_of_tasks_completed
    data_tests:
    - relationships:
        arguments:
          to: ref('project_task')
          field: task_id, task.completed
  - name: team_id
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: team_id
  - name: team_name
    data_tests:
    - relationships:
        arguments:
          to: ref('team')
          field: name
  - name: is_archived
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: archived
  - name: created_at
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: created_at
  - name: current_status
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: current_status
  - name: due_date
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: due_date
  - name: last_modified_at
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: modified_at
  - name: owner_user_id
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: owner_id
  - name: number_of_users_involved
    data_tests:
    - relationships:
        arguments:
          to: ref('project_task')
          field: task_id, task.assignee_id
  - name: notes
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: notes
