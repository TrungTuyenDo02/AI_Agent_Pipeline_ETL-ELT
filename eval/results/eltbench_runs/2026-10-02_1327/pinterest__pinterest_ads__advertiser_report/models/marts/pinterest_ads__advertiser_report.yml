version: 2
models:
- name: pinterest_ads__advertiser_report
  columns:
  - name: date_day
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: date
  - name: advertiser_name
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('advertiser_history')
          field: name
  - name: advertiser_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: advertiser_id
  - name: currency_code
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('advertiser_history')
          field: currency
  - name: country
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('advertiser_history')
          field: country
  - name: spend
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: spend_in_micro_dollar
  - name: clicks
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: clickthrough_1, advertiser_report.clickthrough_2
  - name: impressions
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: impression_1, advertiser_report.impression_2
  - name: total_conversions
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: total_conversions
  - name: total_conversions_quantity
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: total_conversions_quantity
  - name: total_conversions_value
    data_tests:
    - relationships:
        arguments:
          to: ref('advertiser_report')
          field: total_conversions_value_in_micro_dollar
