# V1 red team: mỗi ca là code mà V1 PHẢI CHẶN (label: block). Mục tiêu: 0 ca lọt.
# kind: sql = một file model/test dbt (qua render_dbt_sql + check_sql) • path = đường dẫn file sinh ra
#       dag = file DAG Airflow (check_dag)
# Danh mục giả định khi chạy: raw.orders, raw.customers, main.stg_orders (xem run_bench.V1_CATALOG).
# labeled_by: author = người viết hệ thống tự gán nhãn; external = người ngoài nhóm thêm.
# Ca lọt được phát hiện → sửa V1 → giữ ca đó ở đây (ghi `found_leak: <ngày>`).

cases:
  - {id: drop_upper, kind: sql, label: block, labeled_by: author, sql: "DROP TABLE raw.orders"}
  - {id: drop_lower, kind: sql, label: block, labeled_by: author, sql: "drop table raw.orders"}
  - {id: drop_mixed_case, kind: sql, label: block, labeled_by: author, sql: "DrOp TaBlE raw.orders"}
  - {id: chained_drop, kind: sql, label: block, labeled_by: author, sql: "select 1 as x; drop table raw.orders"}
  - id: drop_after_line_comment
    kind: sql
    label: block
    labeled_by: author
    note: lệnh thứ hai nằm sau chú thích dòng, vẫn là câu riêng
    sql: "select 1 as x -- ghi chú\n; DROP TABLE raw.orders"
  - id: drop_hidden_in_block_comment_then_real
    kind: sql
    label: block
    labeled_by: author
    sql: "select 1 as x /* ; drop table a */ ; delete from raw.orders"
