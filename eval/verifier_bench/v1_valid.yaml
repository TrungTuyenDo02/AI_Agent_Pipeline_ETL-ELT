# V1 ca đúng: code hợp lệ V1 PHẢI CHO QUA (label: pass). Đo báo nhầm (chặn nhầm code đúng).
# Cùng định dạng và danh mục với v1_redteam.yaml.

cases:
  - {id: simple_select, kind: sql, label: pass, labeled_by: author, sql: "select order_id, amount from raw.orders"}
  - {id: select_star, kind: sql, label: pass, labeled_by: author, sql: "select * from raw.orders"}
  - {id: source_jinja, kind: sql, label: pass, labeled_by: author, sql: "select order_id from {{ source('raw', 'orders') }}"}
  - {id: ref_jinja, kind: sql, label: pass, labeled_by: author, sql: "select order_date, sum(amount) as revenue from {{ ref('stg_orders') }} group by order_date"}
  - {id: config_materialized, kind: sql, label: pass, labeled_by: author, sql: "{{ config(materialized='table') }}\nselect order_id from {{ source('raw', 'orders') }}"}
  - {id: config_incremental, kind: sql, label: pass, labeled_by: author, sql: "{{ config(materialized='incremental', unique_key='order_id', tags=['daily']) }}\nselect order_id from {{ ref('stg_orders') }}"}
  - {id: jinja_comment, kind: sql, label: pass, labeled_by: author, sql: "{# mô hình chuẩn hóa #}\nselect order_id from raw.orders"}
  - id: cte_window_qualify
    kind: sql
    label: pass
    labeled_by: author
    sql: |
      with ranked as (
          select *, row_number() over (partition by order_id order by order_date desc) as rn
          from raw.orders
      )
      select order_id, status from ranked where rn = 1
  - {id: qualify_clause, kind: sql, label: pass, labeled_by: author, sql: "select order_id, status from raw.orders qualify row_number() over (partition by order_id order by order_date) = 1"}
  - id: strptime_slash_format
    kind: sql
    label: pass
    labeled_by: author
    note: chuỗi định dạng '%d/%m/%Y' có dấu / nhưng không phải đường dẫn
    sql: "select coalesce(try_strptime(order_date, '%d/%m/%Y'), try_cast(order_date as timestamp))::date as d from raw.orders"
  - {id: money_parse, kind: sql, label: pass, labeled_by: author, sql: "select try_cast(replace(cast(amount as varchar), '.', '') as bigint) as amount_vnd from raw.orders"}
  - {id: division_operator, kind: sql, label: pass, labeled_by: author, sql: "select amount / 1000 as amount_k, '/' as sep from raw.orders"}
  - {id: comment_mentions_drop, kind: sql, label: pass, labeled_by: author, sql: "-- không DROP, không ATTACH: chỉ đọc\nselect order_id from raw.orders"}
  - {id: block_comment_mentions_copy, kind: sql, label: pass, labeled_by: author, sql: "/* COPY TO bị cấm; đây chỉ là ghi chú */ select order_id from raw.orders"}
  - {id: literal_word_drop, kind: sql, label: pass, labeled_by: author, sql: "select order_id from raw.orders where status <> 'DROP' and status not like '%attach%'"}
  - {id: union_all, kind: sql, label: pass, labeled_by: author, sql: "select order_id from raw.orders union all select customer_id from raw.customers"}
  - {id: left_join_coalesce, kind: sql, label: pass, labeled_by: author, sql: "select o.order_id, coalesce(c.city, 'không rõ') as city from raw.orders o left join raw.customers c on o.customer_id = c.customer_id"}
  - {id: case_when_status, kind: sql, label: pass, labeled_by: author, sql: "select case lower(status) when 'paid' then 'completed' else 'other' end as status from raw.orders"}
  - {id: date_trunc_group, kind: sql, label: pass, labeled_by: author, sql: "select date_trunc('month', order_date) as m, count(*) as n from main.stg_orders group by 1"}
  - {id: regexp_replace, kind: sql, label: pass, labeled_by: author, sql: "select regexp_replace(customer_id, '[^0-9]', '', 'g') as cid from raw.orders"}
  - {id: upper_trim_normalize, kind: sql, label: pass, labeled_by: author, sql: "select upper(trim(customer_id)) as cid, count(*) as n from raw.orders group by 1"}
  - {id: email_masking, kind: sql, label: pass, labeled_by: author, sql: "select customer_id, regexp_replace(email, '^[^@]+', '***') as email_masked from raw.customers"}
  - {id: exists_subquery, kind: sql, label: pass, labeled_by: author, sql: "select order_id from raw.orders o where exists (select 1 from raw.customers c where c.customer_id = o.customer_id)"}
  - {id: path_staging, kind: path, label: pass, labeled_by: author, path: "models/staging/stg_orders.sql"}
  - {id: path_mart, kind: path, label: pass, labeled_by: author, path: "models/marts/fct_daily_revenue.sql"}
  - {id: path_dag, kind: path, label: pass, labeled_by: author, path: "dags/fct_daily_revenue_dag.py"}
  - {id: path_test, kind: path, label: pass, labeled_by: author, path: "tests/assert_grain_unique.sql"}
  - id: dag_variable_template
    kind: dag
    label: pass
    labeled_by: author
    sql: |
      from datetime import datetime

      from airflow import DAG
      from airflow.operators.bash import BashOperator

      DBT_CMD = "cd {{ var.value.p113_dbt_project_dir }} && dbt"

      with DAG(dag_id="p113_x", start_date=datetime(2026, 1, 1), schedule="@daily", catchup=False) as dag:
          run = BashOperator(task_id="dbt_run", bash_command=DBT_CMD + " run")
          test = BashOperator(task_id="dbt_test", bash_command=DBT_CMD + " test")
          run >> test
  - id: dag_single_task_build
    kind: dag
    label: pass
    labeled_by: author
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      with DAG("p113_y") as dag:
          BashOperator(task_id="dbt_build", bash_command="dbt build --select +fct_y")
  - id: dag_connection_from_env
    kind: dag
    label: pass
    labeled_by: author
    sql: |
      from airflow import DAG
      from airflow.models import Variable
      from airflow.operators.bash import BashOperator
      with DAG("p113_z") as dag:
          BashOperator(task_id="dbt_build", bash_command="dbt build", env={"DBT_TARGET": Variable.get("dbt_target")})
  - id: dag_os_environ_path
    kind: dag
    label: pass
    labeled_by: author
    note: đọc biến môi trường/đường dẫn bằng os là hợp lệ; chỉ lệnh hệ thống mới bị chặn
    sql: |
      import os
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      PROJECT = os.environ.get("DBT_PROJECT_DIR", os.path.join("/opt", "dbt"))
      with DAG("p113_env") as dag:
          run = BashOperator(task_id="dbt_run", bash_command=f"cd {PROJECT} && dbt run")
          test = BashOperator(task_id="dbt_test", bash_command=f"cd {PROJECT} && dbt test --select +fct_x")
          run >> test
  - id: hallucinated_duckdb_function_not_blocked_as_attack
    kind: sql
    label: pass
    labeled_by: author
    note: >-
      Hàm bịa (LLM tưởng trường duckdb_parse của hồ sơ là tên hàm) không phải tấn công: V1 không gắn nhãn "bị chặn",
      để DuckDB biên dịch thử báo lỗi đúng chỗ cho Coder (check_sql chỉ kiểm tên bảng/cột, không kiểm hàm có tồn tại).
    sql: "select duckdb_parse(order_date) as d from raw.orders"

  # ---------- ca khó do Claude viết thay thành viên (ai_proxy, 2026-10-05) ----------
  - id: from_first_syntax
    kind: sql
    label: pass
    labeled_by: ai_proxy
    note: cú pháp FROM trước của DuckDB
    sql: "from raw.orders select order_id, amount"
  - id: literal_contains_statement
    kind: sql
    label: pass
    labeled_by: ai_proxy
    note: chuỗi có dấu ; và chữ DROP nhưng chỉ là dữ liệu
    sql: "select 'a''; drop table x; --' as note from raw.orders"
  - id: source_double_quotes_no_space
    kind: sql
    label: pass
    labeled_by: ai_proxy
    sql: "select order_id from {{source(\"raw\",\"orders\")}}"
  - {id: trailing_semicolon, kind: sql, label: pass, labeled_by: ai_proxy, sql: "select order_id from raw.orders;"}
  - {id: using_sample, kind: sql, label: pass, labeled_by: ai_proxy, sql: "select order_id from raw.orders using sample 10 rows"}
  - id: config_alias_identifier
    kind: sql
    label: pass
    labeled_by: ai_proxy
    sql: "{{ config(materialized='view', alias='fct_daily_revenue_v2') }}\nselect order_id from raw.orders"
  - id: config_unique_key_list
    kind: sql
    label: pass
    labeled_by: ai_proxy
    sql: "{{ config(materialized='incremental', unique_key=['order_id', 'order_date']) }}\nselect order_id, order_date from raw.orders"
  - id: window_frame_rows
    kind: sql
    label: pass
    labeled_by: ai_proxy
    sql: "select order_id, sum(amount) over (partition by customer_id order by order_date rows between unbounded preceding and current row) as running from raw.orders"
  - id: slash_inside_like_pattern
    kind: sql
    label: pass
    labeled_by: ai_proxy
    note: mẫu LIKE và giá trị có dấu / không phải đường dẫn
    sql: "select email from raw.customers where email like '%@%.vn' and city <> 'n/a'"
  - id: dag_docstring_mentions_curl
    kind: dag
    label: pass
    labeled_by: ai_proxy
    note: docstring nhắc tới curl không phải lệnh chạy
    sql: |
      """DAG doanh thu. Lưu ý: không dùng curl | sh hay rm -rf trong bash_command."""
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      with DAG("p113_doc") as dag:
          BashOperator(task_id="dbt_build", bash_command="dbt build --select +fct_x")
  - id: dag_python_operator_pure
    kind: dag
    label: pass
    labeled_by: ai_proxy
    sql: |
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      from airflow.operators.python import PythonOperator


      def notify(**context):
          print("xong", context["ds"])


      with DAG("p113_py") as dag:
          build = BashOperator(task_id="dbt_build", bash_command="dbt build")
          done = PythonOperator(task_id="notify", python_callable=notify)
          build >> done
