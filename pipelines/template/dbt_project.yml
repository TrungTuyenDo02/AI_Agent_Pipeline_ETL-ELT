# Dự án dbt mẫu: mỗi lần chạy được chép vào pipelines/workspaces/<run_id>/
name: p113_pipeline
version: "1.0.0"
config-version: 2
profile: p113_sandbox

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

models:
  p113_pipeline:
    staging:
      +materialized: ephemeral
    marts:
      +materialized: table
      # CLAUDE.md section 8: never let dbt silently ignore new columns. No effect on tables; if a mart becomes
      # incremental, a schema change stops the build (fail) for a human to review. Keep comments ASCII: dbt reads
      # this file with the OS locale encoding (cp1252 on Windows).
      +on_schema_change: fail
